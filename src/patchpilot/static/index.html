<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PatchPilot</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <a class="skip-link" href="#app-main">Skip to main content</a>

    <div id="backend-banner" class="banner banner--error" hidden role="alert"></div>

    <header id="app-header" class="header" aria-label="PatchPilot header"></header>

    <div class="layout layout--app">
        <nav id="app-nav" class="nav" aria-label="Primary"></nav>

        <main id="app-main" class="main" tabindex="-1" aria-live="polite"></main>

        <aside class="aside" aria-label="Demo controls">
            <button
                type="button"
                id="demo-controls-toggle"
                class="demo-controls__toggle"
                aria-expanded="false"
                aria-controls="demo-controls-panel"
            >
                Demo controls
            </button>
            <div id="demo-controls-panel" class="demo-controls__panel" hidden>
                <div id="demo-controls-root"></div>
            </div>
        </aside>
    </div>

    <div id="live-announcer" class="visually-hidden" aria-live="assertive" aria-atomic="true"></div>

    <div id="approval-root" class="approval-root" hidden></div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
